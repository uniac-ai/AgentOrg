# The agent actor for Codex. Add this table to a trusted project's
# .codex/config.toml, so that sessions in that project fill positions, or to
# ~/.codex/config.toml for every project. Name agentorg by its absolute path when
# Codex starts without your shell's PATH. Codex starts `agentorg agent` for each
# session; the session attaches to its position with the attach tool. Codex
# names no session to it, so a session attaches again whenever it starts, and
# nothing wakes an idle Codex session yet.

[mcp_servers.org]
command = "agentorg"
args = ["agent", "--client", "codex"]
# Set these when the core is not at the default address and home.
# env = { AGENTORG_URL = "http://127.0.0.1:8740", AGENTORG_HOME = "/path/to/home" }
