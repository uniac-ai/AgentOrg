name: Release

# Publishes @agentorg/cli to npm through Trusted Publishing: npm trusts this workflow, in the `npm`
# environment, by its OIDC identity, so no token is stored anywhere, and the package carries a
# provenance statement linking it to this repository and commit. The repository's other @agentorg
# packages aren't published: they're bundled inside it.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # No Actions cache: a release installs only from the lockfile, never from a cache that
      # other workflow runs can write.
      - name: Install
        run: npm ci
      - name: Install the headless browser for the shell tests
        run: npx playwright install --only-shell chromium
      # The published 0.0.5 the smoke starts sandboxes its Actors in a user namespace, which stock
      # Ubuntu's AppArmor restricts: allowed here, as in CI.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build and test
        run: npm test
      - name: The packed package installs and runs
        run: scripts/smoke-packed.sh
      - name: Check that the tag names the package's version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p 'require("./packages/app/package.json").version')"
      - name: Pack
        run: node packages/app/scripts/pack.js .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: agentorg-cli-*.tgz
      # The core and the frontend alone: files of the release, attached to it, never published.
      - name: Pack the core and the frontend, each alone
        run: |
          node packages/app/scripts/pack.js . --core
          node packages/app/scripts/pack.js . --frontend
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-and-frontend
          path: |
            agentorg-core-*.tgz
            agentorg-frontend-*.tgz

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish
        run: npm publish agentorg-cli-*.tgz --access public --provenance
