name: Mac app

# The Mac app's own side, on a Mac, which the Linux checks can't build: its Rust tests, and its
# bundle, built and then checked file by file. It runs only when the app, its window's page or the
# lockfile changes. Nothing here needs a privacy grant, a person or a signing identity: the bundle
# is signed ad hoc, and nothing of it is registered or opened. What needs those is checked on a Mac
# by hand.

on:
  pull_request:
    paths:
      - "packages/mac/**"
      - "packages/mac-window/**"
      - "package-lock.json"
      - ".github/workflows/mac.yml"
  push:
    branches: [main]
    paths:
      - "packages/mac/**"
      - "packages/mac-window/**"
      - "package-lock.json"
      - ".github/workflows/mac.yml"

permissions:
  contents: read

jobs:
  app:
    # Apple silicon, as the Node the bundle carries is.
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      # The Rust the app is built with on the Mac it is tried on.
      RUSTUP_TOOLCHAIN: "1.93.1"
      # Cua Driver, asked its version, sends no telemetry and checks for no update, as the app
      # starts it.
      DO_NOT_TRACK: "1"
      CUA_DRIVER_RS_UPDATE_CHECK: "false"
      # As `tauri build` sets it from minimumSystemVersion, so the tests' build is reused there.
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Install
        run: npm ci
      - name: The app's Rust tests
        working-directory: packages/mac/src-tauri
        run: cargo test --release --locked
      # The assembly fetches Node and Cua Driver and checks each against its pin, its release's
      # sums and, for the driver, GitHub's digest, before anything of it goes in.
      - name: Build the app
        run: npm run app --workspace @agentorg/mac
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check the bundle
        run: |
          set -euxo pipefail
          app=packages/mac/src-tauri/target/release/bundle/macos/AgentOrg.app
          plist="$app/Contents/Info.plist"
          agent="$app/Contents/Library/LaunchAgents/dev.agentorg.mac.provider.plist"
          read_key() { plutil -extract "$2" raw "$1"; }
          pinned() { node -p "require('./packages/mac/$1')$2"; }
          codesign --verify --deep --strict "$app"
          test "$(read_key "$plist" CFBundleIdentifier)" = dev.agentorg.mac
          test "$(read_key "$plist" LSUIElement)" = true
          test "$(read_key "$plist" CFBundleIconFile)" = icon.icns
          cmp "$app/Contents/Resources/icon.icns" packages/mac/src-tauri/icons/icon.icns
          # The background item: the one plist, as kept, naming the app's own program.
          test "$(ls "$app/Contents/Library/LaunchAgents")" = dev.agentorg.mac.provider.plist
          cmp "$agent" packages/mac/src-tauri/provider.plist
          test -x "$app/$(read_key "$agent" BundleProgram)"
          # Only the app's own program and Node in Contents/MacOS: the driver stays a resource.
          test "$(ls "$app/Contents/MacOS" | tr '\n' ' ')" = "AgentOrg node "
          # Each program the provider runs, signed on its own, with the hardened runtime.
          for program in "$app/Contents/MacOS/node" "$app/Contents/Resources/cua-driver"; do
            codesign --verify --strict "$program"
            codesign -dv "$program" 2>&1 | grep -E "flags=0x[0-9a-f]+\([a-z,]*runtime"
          done
          test "$(node -p "require('./$app/Contents/Resources/agentcomputer/package.json').version")" = "$(pinned package.json ".dependencies['@agentorg/computer']")"
          test "$("$app/Contents/MacOS/node" --version)" = "v$(pinned assembly.json .node.version)"
          test "$("$app/Contents/Resources/cua-driver" --version)" = "cua-driver $(pinned assembly.json .driver.version)"
          # The bundled Node runs JavaScript, and loads the terminal's native module, under its
          # hardened runtime and entitlements.
          "$app/Contents/MacOS/node" -e 'require(process.argv[1])' "$PWD/$app/Contents/Resources/agentcomputer/node_modules/node-pty"
          # The app's own program, in a way that needs no grant: nothing is registered here.
          said="$("$app/Contents/MacOS/AgentOrg" unregister)"
          case "$said" in "the background item isn't registered; "*) ;; *) exit 1 ;; esac
