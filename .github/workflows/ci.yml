name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint and format
        run: npx biome check .
      - name: Build and test
        run: npm test

  packed-sdk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Pack SDK and prepare existing consumer flow
        run: |
          mkdir -p "$RUNNER_TEMP/sdk-container/scripts" "$RUNNER_TEMP/sdk-container/test/fixtures"
          npm pack --pack-destination "$RUNNER_TEMP/sdk-container"
          cp package-lock.json "$RUNNER_TEMP/sdk-container/"
          cp scripts/verify-packed-sdk.mjs "$RUNNER_TEMP/sdk-container/scripts/"
          cp test/fixtures/packed-* "$RUNNER_TEMP/sdk-container/test/fixtures/"
      - name: Build isolated SDK consumer container
        run: docker build --build-arg NODE_VERSION=${{ matrix.node }} -f "$RUNNER_TEMP/sdk-container/test/fixtures/packed-sdk.Dockerfile" -t agentorg-sdk-proof "$RUNNER_TEMP/sdk-container"
      - name: Start container and verify public SDK, declarations and restart
        run: docker run --rm --name agentorg-sdk-proof agentorg-sdk-proof
