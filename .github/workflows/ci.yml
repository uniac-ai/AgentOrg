name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Install the headless browser for the shell tests
        run: npx playwright install --only-shell chromium
      - name: Lint and format
        run: npm run check
      - name: Imports stay in their module
        run: node scripts/check-imports.mjs && node --test scripts/check-imports.test.mjs
      # The runner carries shellcheck. get.sh hands on to the install page; install.sh is the
      # script the page serves from a release.
      - name: Check get.sh and install.sh
        run: shellcheck get.sh install.sh
      # The published 0.0.5 the smoke starts sandboxes its Actors in a user namespace, which stock
      # Ubuntu's AppArmor restricts.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build and test
        run: npm test
      - name: The packed package installs and runs
        run: scripts/smoke-packed.sh
