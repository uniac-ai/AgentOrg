[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agentorg"
description = "A local service that organizes AI agent sessions like a company: hierarchy, reports and decisions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "fastapi>=0.162",
    "httpx>=0.28",
    "mcp>=2.3",
    "pydantic>=2.14",
    "uvicorn>=0.54",
]

[project.scripts]
agentorg = "agentorg.cli:main"

[project.urls]
Repository = "https://github.com/uniac-ai/agentorg"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.17",
]

[tool.hatch.version]
path = "src/agentorg/__init__.py"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
