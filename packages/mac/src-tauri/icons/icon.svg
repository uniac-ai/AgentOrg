<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Satin aluminum icon on dark graphite"><title>Satin aluminum icon on dark graphite</title><defs><linearGradient xmlns="http://www.w3.org/2000/svg" id="E1-fill" x1="15%" y1="0%" x2="80%" y2="100%"><stop offset="0%" stop-color="#fbfcfd" stop-opacity="1" /><stop offset="25.0%" stop-color="#e4e8ec" stop-opacity="1" /><stop offset="50.0%" stop-color="#b4bdc6" stop-opacity="1" /><stop offset="72.0%" stop-color="#e2e6ea" stop-opacity="1" /><stop offset="100%" stop-color="#9fa9b3" stop-opacity="1" /></linearGradient><filter xmlns="http://www.w3.org/2000/svg" id="E1-surface" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
