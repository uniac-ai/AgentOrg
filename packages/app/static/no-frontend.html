<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AgentOrg</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        background: rgb(20 20 20);
        color: rgb(250 250 250);
        font: 14px/1.45 ui-sans-serif, system-ui, sans-serif;
      }
      main {
        max-width: 32rem;
        padding: 0 1.5rem;
      }
      code {
        font: 13px ui-monospace, monospace;
      }
    </style>
  </head>
  <body>
    <main>
      <p>AgentOrg is running, with no frontend to show here.</p>
      <p>
        Start it with <code>agentorg --frontend DIR</code>, where <code>DIR</code> is the frontend
        of the same release, or install <code>@agentorg/cli</code>, which carries one.
      </p>
    </main>
  </body>
</html>
